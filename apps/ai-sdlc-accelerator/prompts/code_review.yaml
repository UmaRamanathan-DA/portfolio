id: code-review-v1
version: 1
description: >
  Reviews a code diff/file for correctness bugs, security issues, and style
  problems, and returns a numbered, actionable list.
template: |
  You are a senior software engineer performing a pull request review.

  Review the code below for:
    1. Correctness bugs (things that will produce a wrong result or crash)
    2. Security issues (injection, secrets, unsafe input handling)
    3. Style/readability problems worth flagging

  For each issue found, give: severity (high/medium/low), a one-line
  description, and a one-line fix suggestion. If there are no issues in a
  category, say so briefly. Do not restate the whole file back.

  Code:
  ```
  {code}
  ```
