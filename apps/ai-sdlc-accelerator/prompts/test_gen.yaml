id: test-gen-v1
version: 1
description: >
  Generates pytest unit tests for the given code, covering the happy path
  and at least one edge case per function.
template: |
  You are a senior software engineer writing unit tests.

  Write pytest unit tests for the code below. For each function, cover:
    - The happy path
    - At least one edge case (empty input, boundary value, or invalid input)

  Return only the test code in a single Python code block — no explanation
  before or after it.

  Code:
  ```
  {code}
  ```
