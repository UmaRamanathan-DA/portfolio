<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 feature adoption curve</title>
  <desc id="desc">8-week adoption curve for offline mode, auto-sync, draft save</desc>
  <rect width="880" height="420" fill="#f7f3e9"/>
  <text x="40" y="42" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#1c1b18">Feature Adoption  8 Weeks</text>
  <text x="40" y="68" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#4a463c">Core aha-moment features (illustrative)</text>

  <!-- axes -->
  <line x1="80" y1="340" x2="820" y2="340" stroke="#cbbfa6" stroke-width="2"/>
  <line x1="80" y1="110" x2="80" y2="340" stroke="#cbbfa6" stroke-width="2"/>
  <text x="80" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#4a463c">Week 1</text>
  <text x="400" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#4a463c">Week 4</text>
  <text x="740" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#4a463c">Week 8</text>

  <!-- Offline Mode 41 ’ 68 ’ 83 -->
  <polyline fill="none" stroke="#1f5c6b" stroke-width="3" points="100,275 430,188 760,140"/>
  <circle cx="100" cy="275" r="6" fill="#64748b"/>
  <circle cx="430" cy="188" r="6" fill="#1f5c6b"/>
  <circle cx="760" cy="140" r="6" fill="#1f5c6b"/>
  <text x="770" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f5c6b">Offline 83%</text>

  <!-- Auto-Sync 38 ’ 72 ’ 88 -->
  <polyline fill="none" stroke="#2c8672" stroke-width="3" points="100,285 430,175 760,125"/>
  <circle cx="100" cy="285" r="5" fill="#64748b"/>
  <circle cx="430" cy="175" r="5" fill="#2c8672"/>
  <circle cx="760" cy="125" r="5" fill="#2c8672"/>
  <text x="770" y="118" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#2c8672">Auto-sync 88%</text>

  <!-- Draft Save 45 ’ 74 ’ 86 -->
  <polyline fill="none" stroke="#3d6e8c" stroke-width="3" points="100,262 430,168 760,132"/>
  <circle cx="100" cy="262" r="5" fill="#64748b"/>
  <circle cx="430" cy="168" r="5" fill="#3d6e8c"/>
  <circle cx="760" cy="132" r="5" fill="#3d6e8c"/>
  <text x="100" y="250" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#64748b">Draft 45% ’ 86%</text>

  <text x="40" y="400" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#4a463c">Offline mode adoption reached 83% by week 8, up from 41% in week 1</text>
</svg>
