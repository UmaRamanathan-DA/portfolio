<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Phase 3 agent architecture</title>
  <desc id="desc">Compliance Field Copilot orchestrator and 6-tool architecture</desc>
  <rect width="920" height="480" fill="#f7f3e9"/>
  <text x="40" y="40" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#1c1b18">Compliance Field Copilot  Agent Architecture</text>
  <text x="40" y="66" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#4a463c">1 orchestrator coordinating 6 specialised agent tools</text>

  <rect x="200" y="95" width="520" height="70" rx="10" fill="#1f5c6b"/>
  <text x="460" y="125" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">Orchestrator</text>
  <text x="460" y="148" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#d7ebe8">Intent routing · Session state · Guardrails · Disclosure</text>

  <!-- tools -->
  <g font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1b18">
    <rect x="40" y="220" width="130" height="70" rx="8" fill="#fff" stroke="#1f5c6b" stroke-width="2"/>
    <text x="105" y="260" text-anchor="middle">Template</text>
    <text x="105" y="278" text-anchor="middle">Recommender</text>

    <rect x="185" y="220" width="130" height="70" rx="8" fill="#fff" stroke="#1f5c6b" stroke-width="2"/>
    <text x="250" y="260" text-anchor="middle">Autofill</text>
    <text x="250" y="278" text-anchor="middle">Engine</text>

    <rect x="330" y="220" width="130" height="70" rx="8" fill="#fff" stroke="#1f5c6b" stroke-width="2"/>
    <text x="395" y="260" text-anchor="middle">Voice-to-</text>
    <text x="395" y="278" text-anchor="middle">Form NLP</text>

    <rect x="475" y="220" width="130" height="70" rx="8" fill="#fff" stroke="#1f5c6b" stroke-width="2"/>
    <text x="540" y="260" text-anchor="middle">Validation</text>
    <text x="540" y="278" text-anchor="middle">Agent</text>

    <rect x="620" y="220" width="130" height="70" rx="8" fill="#fff" stroke="#1f5c6b" stroke-width="2"/>
    <text x="685" y="260" text-anchor="middle">Adoption</text>
    <text x="685" y="278" text-anchor="middle">Risk Scorer</text>

    <rect x="765" y="220" width="130" height="70" rx="8" fill="#fff" stroke="#1f5c6b" stroke-width="2"/>
    <text x="830" y="260" text-anchor="middle">Manager</text>
    <text x="830" y="278" text-anchor="middle">RAG Q&amp;A</text>
  </g>

  <!-- connectors -->
  <g stroke="#64748b" stroke-width="1.5" fill="none">
    <path d="M460 165 L105 220"/>
    <path d="M460 165 L250 220"/>
    <path d="M460 165 L395 220"/>
    <path d="M460 165 L540 220"/>
    <path d="M460 165 L685 220"/>
    <path d="M460 165 L830 220"/>
  </g>

  <rect x="120" y="340" width="680" height="90" rx="10" fill="#64748b"/>
  <text x="460" y="378" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Platform APIs</text>
  <text x="460" y="405" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#eef2f6">assessments · drafts · sync · templates · offline queue · audit log · escalation</text>
</svg>
