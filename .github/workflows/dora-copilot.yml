name: DORA Copilot CI

on:
  push:
    paths:
      - "apps/dora-copilot/**"
      - "render.yaml"
      - ".github/workflows/dora-copilot.yml"
  pull_request:
    paths:
      - "apps/dora-copilot/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dora-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v
