<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 activation funnel</title>
  <desc id="desc">Desktop vs iPad completion funnel, pre and post redesign</desc>
  <rect width="880" height="420" fill="#f7f3e9"/>
  <text x="40" y="42" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#1c1b18">Activation Funnel - Desktop vs iPad</text>
  <text x="40" y="68" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#4a463c">Completion at final stage (illustrative)</text>
  <rect x="520" y="28" width="14" height="14" fill="#64748b"/>
  <text x="542" y="40" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#1c1b18">Before / baseline</text>
  <rect x="680" y="28" width="14" height="14" fill="#1f5c6b"/>
  <text x="702" y="40" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#1c1b18">After / improved</text>
  <text x="40" y="120" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1b18">Desktop</text>
  <rect x="40" y="140" width="328" height="44" rx="6" fill="#64748b"/>
  <text x="56" y="168" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">82% fully submitted</text>
  <text x="40" y="230" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1b18">iPad Pre-Redesign</text>
  <rect x="40" y="250" width="84" height="44" rx="6" fill="#64748b"/>
  <text x="56" y="278" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">21%</text>
  <text x="40" y="340" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1b18">iPad Post-Redesign</text>
  <rect x="40" y="360" width="220" height="44" rx="6" fill="#1f5c6b"/>
  <text x="56" y="388" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">55% - 4x higher activation</text>
  <text x="420" y="200" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" fill="#4a463c">6 stages: Access &gt; Login &gt; Open &gt; Enter &gt; Draft &gt; Submit</text>
  <text x="420" y="230" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" fill="#4a463c">Final funnel stage shown above.</text>
</svg>
