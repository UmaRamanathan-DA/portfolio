<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 retention impact</title>
  <desc id="desc">Before/after strip for time-to-submission, offline-path usage, 90-day retention</desc>
  <rect width="880" height="320" fill="#f7f3e9"/>
  <text x="40" y="42" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#1c1b18">Retention &amp; Path Impact</text>
  <text x="40" y="68" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#4a463c">Before / after (illustrative)</text>
  <rect x="40" y="100" width="250" height="170" rx="10" fill="#fff" stroke="#ddd2bb"/>
  <text x="60" y="135" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#4a463c">Time to first submission</text>
  <text x="60" y="175" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" fill="#64748b">62 min</text>
  <text x="60" y="210" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f5c6b">28 min</text>
  <text x="60" y="245" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#4a463c">55% reduction</text>
  <rect x="315" y="100" width="250" height="170" rx="10" fill="#fff" stroke="#ddd2bb"/>
  <text x="335" y="135" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#4a463c">Offline-path completions</text>
  <text x="335" y="175" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" fill="#64748b">5%</text>
  <text x="335" y="210" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f5c6b">38%</text>
  <text x="335" y="245" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#4a463c">3.8x growth</text>
  <rect x="590" y="100" width="250" height="170" rx="10" fill="#fff" stroke="#ddd2bb"/>
  <text x="610" y="135" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" fill="#4a463c">90-day retention</text>
  <text x="610" y="175" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" fill="#64748b">17%</text>
  <text x="610" y="210" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f5c6b">64%</text>
  <text x="610" y="245" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#4a463c">3.8x higher</text>
</svg>
